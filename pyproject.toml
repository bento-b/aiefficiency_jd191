[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bento-b-aiefficiency_jd191"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bento-b" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bento-b.github.io"
Repository = "https://github.com/bento-b/aiefficiency_jd191"
Issues = "https://github.com/bento-b/aiefficiency_jd191/issues"

[project.scripts]
aiefficiency_jd191 = "aiefficiency_jd191:main"

[tool.setuptools]
py-modules = ["aiefficiency_jd191"]
